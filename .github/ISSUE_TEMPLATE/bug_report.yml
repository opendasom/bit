name: Bug report
description: Report reproducible incorrect or unsafe behavior in Bit.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not disclose vulnerabilities or secrets here; use the private security reporting link instead.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Select the component where the problem occurs.
      options:
        - CLI
        - Smart contracts
        - Web3 explorer
        - IPFS integration
        - Build or CI
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clearly describe the incorrect behavior and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence of commands or actions that reproduces the problem.
      placeholder: |
        1. Start ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include sanitized logs or error output when useful.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the Bit commit or version, operating system, Go version, and relevant Node.js, Foundry, IPFS, wallet, browser, network, or RPC details.
      render: text
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other sanitized information that may help diagnose the problem.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed private keys, credentials, sensitive source data, and other secrets from this report.
          required: true
        - label: I reproduced this without using mainnet contracts or wallets holding real value.
          required: true
